name = "Georg Sachs"

[signing]
behavior = "own"
backend = "gpg"
key = "F94EBE10F06321A70109E7C574A62E84A0031125"

[ui]
show-cryptographic-signatures = true
pager = "delta"
diff-formatter = ":git"

[templates]
log = "simple_log"

[template-aliases]
empty_commit_marker = "label('empty', '▢')"

simple_log = """
  separate(" ",
    pad_end(
      4,
      separate("/",
        self.change_id().shortest(),
        if(self.divergent() || self.hidden(), self.change_offset())
      )
    ),
    if(self.immutable(), "🔒", "  ") ++ " ",
    if(self.empty(), empty_commit_marker),
    if(self.description(), self.description().first_line(), if(self.empty(), '', label('no_description', '←'))),
    self.bookmarks()
  )
"""
